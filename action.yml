name: SkillCheck v1
description: Scan packages, generate reports, compare pull-request risk, and enforce fingerprint-bound evidence.
author: SixScripts AI
branding:
  icon: shield
  color: red
inputs:
  path:
    description: Repository-relative package path.
    required: false
    default: .
  config:
    description: Repository-relative policy JSON path.
    required: false
    default: skillcheck.config.json
  evidence:
    description: Optional release evidence JSON path.
    required: false
    default: ""
  mode:
    description: scan or gate.
    required: false
    default: scan
  annotations:
    description: Emit GitHub annotations for report occurrences.
    required: false
    default: "true"
  annotation-limit:
    description: Maximum GitHub annotations emitted by one scan.
    required: false
    default: "50"
outputs:
  report:
    description: Repository-relative path to the generated JSON report.
    value: ${{ steps.skillcheck.outputs.report }}
  sarif:
    description: Repository-relative path to the generated SARIF report.
    value: ${{ steps.skillcheck.outputs.sarif }}
  status:
    description: "SkillCheck report status: pass, review, or block."
    value: ${{ steps.skillcheck.outputs.status }}
  score:
    description: SkillCheck score from 0 to 100.
    value: ${{ steps.skillcheck.outputs.score }}
  fingerprint:
    description: SHA-256 fingerprint of the scanned package.
    value: ${{ steps.skillcheck.outputs.fingerprint }}
  policy-fingerprint:
    description: SHA-256 fingerprint of the policy used for the scan.
    value: ${{ steps.skillcheck.outputs.policy-fingerprint }}
  publishable:
    description: Whether the report gate considers the package publishable.
    value: ${{ steps.skillcheck.outputs.publishable }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Run SkillCheck
      id: skillcheck
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EVIDENCE: ${{ inputs.evidence }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_ANNOTATION_LIMIT: ${{ inputs.annotation-limit }}
      run: |
        set -euo pipefail
        config_args=()
        if [[ -n "$INPUT_CONFIG" && -f "${GITHUB_WORKSPACE}/${INPUT_CONFIG}" ]]; then
          config_args=(--config "${GITHUB_WORKSPACE}/${INPUT_CONFIG}")
        fi

        scan_status=0
        node "${GITHUB_ACTION_PATH}/packages/cli/src/index.js" scan \
          --root "${GITHUB_WORKSPACE}/${INPUT_PATH}" \
          --repository "${GITHUB_REPOSITORY}" \
          --ref "${GITHUB_SHA}" \
          --path "$INPUT_PATH" \
          --quiet \
          "${config_args[@]}" || scan_status=$?

        report="${GITHUB_WORKSPACE}/${INPUT_PATH}/.skillcheck/report.json"
        sarif="${GITHUB_WORKSPACE}/${INPUT_PATH}/.skillcheck/report.sarif"
        final_status=$scan_status

        if [[ "$INPUT_MODE" == "gate" && "$scan_status" -eq 0 ]]; then
          evidence_args=()
          if [[ -n "$INPUT_EVIDENCE" ]]; then
            evidence_args=(--evidence "${GITHUB_WORKSPACE}/${INPUT_EVIDENCE}")
          fi
          gate_status=0
          node "${GITHUB_ACTION_PATH}/packages/cli/src/index.js" gate \
            --report "$report" \
            --root "${GITHUB_WORKSPACE}/${INPUT_PATH}" \
            "${config_args[@]}" \
            "${evidence_args[@]}" || gate_status=$?
          final_status=$gate_status
        fi

        markdown="${GITHUB_WORKSPACE}/${INPUT_PATH}/.skillcheck/report.md"
        if [[ -f "$markdown" ]]; then
          cat "$markdown" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -f "$report" && "$INPUT_ANNOTATIONS" == "true" ]]; then
          node "${GITHUB_ACTION_PATH}/packages/cli/src/index.js" annotations \
            --report "$report" \
            --max "$INPUT_ANNOTATION_LIMIT"
        fi

        if [[ -f "$report" ]]; then
          SKILLCHECK_REPORT_PATH="$report" SKILLCHECK_SARIF_PATH="$sarif" node --input-type=module <<'NODE'
        import fs from "node:fs";
        import path from "node:path";

        const reportPath = process.env.SKILLCHECK_REPORT_PATH;
        const sarifPath = process.env.SKILLCHECK_SARIF_PATH;
        const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
        const relative = (value) => path.relative(process.env.GITHUB_WORKSPACE, value).split(path.sep).join("/");
        const outputs = {
          report: relative(reportPath),
          sarif: fs.existsSync(sarifPath) ? relative(sarifPath) : "",
          status: report.status,
          score: String(report.score),
          fingerprint: report.fingerprint,
          "policy-fingerprint": report.policyFingerprint,
          publishable: String(Boolean(report.gate?.publishable)),
        };
        fs.appendFileSync(
          process.env.GITHUB_OUTPUT,
          Object.entries(outputs).map(([key, value]) => `${key}=${value}`).join("\n") + "\n",
        );
        NODE
        fi

        exit "$final_status"
