name: SkillCheck v1
summary: Deterministic release gate for AI agent skill packages
description: Scan packages, generate reports, compare pull-request risk, and enforce fingerprint-bound evidence.
author: SixScripts AI
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Repository-relative package path.
    required: false
    default: .
  config:
    description: Repository-relative policy JSON path.
    required: false
    default: skillcheck.config.json
  evidence:
    description: Optional release evidence JSON path.
    required: false
    default: ""
  mode:
    description: scan or gate.
    required: false
    default: scan
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Run SkillCheck
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EVIDENCE: ${{ inputs.evidence }}
        INPUT_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        config_args=()
        if [[ -n "$INPUT_CONFIG" && -f "${GITHUB_WORKSPACE}/${INPUT_CONFIG}" ]]; then
          config_args=(--config "${GITHUB_WORKSPACE}/${INPUT_CONFIG}")
        fi
        node "${GITHUB_ACTION_PATH}/packages/cli/src/index.js" scan \
          --root "${GITHUB_WORKSPACE}/${INPUT_PATH}" \
          --repository "${GITHUB_REPOSITORY}" \
          --ref "${GITHUB_SHA}" \
          --quiet \
          "${config_args[@]}"
        report="${GITHUB_WORKSPACE}/${INPUT_PATH}/.skillcheck/report.json"
        if [[ "$INPUT_MODE" == "gate" ]]; then
          evidence_args=()
          if [[ -n "$INPUT_EVIDENCE" ]]; then evidence_args=(--evidence "${GITHUB_WORKSPACE}/${INPUT_EVIDENCE}"); fi
          node "${GITHUB_ACTION_PATH}/packages/cli/src/index.js" gate \
            --report "$report" \
            --root "${GITHUB_WORKSPACE}/${INPUT_PATH}" \
            "${config_args[@]}" \
            "${evidence_args[@]}"
        fi
        markdown="${GITHUB_WORKSPACE}/${INPUT_PATH}/.skillcheck/report.md"
        if [[ -f "$markdown" ]]; then cat "$markdown" >> "$GITHUB_STEP_SUMMARY"; fi
