name: Web preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-web.mjs
      - run: test -f dist-web/index.html && test -f dist-web/app.js && test -f dist-web/scanner.js && test -f dist-web/styles.css
      - run: node --test tests/web-ui.test.mjs
