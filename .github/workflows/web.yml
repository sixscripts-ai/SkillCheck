name: Web preview
on:
  pull_request:
  push:
    branches: [main, agent/skillcheck-v0.3]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/bootstrap-v03.mjs
      - run: npm install
      - run: npm run build:web
      - run: test -f dist-web/index.html && test -f dist-web/app.js && test -f dist-web/core/engine.js && test -f dist-web/core/zip.js
      - run: python3 -m http.server 4173 -d dist-web > /tmp/skillcheck-http.log 2>&1 &
      - run: curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:4173/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
