name: Web preview
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build:web
      - run: test -f dist-web/index.html && test -f dist-web/packages/sdk/src/index.js
      - run: python3 -m http.server 4173 -d dist-web >/tmp/skillcheck-web.log 2>&1 &
      - run: curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:4173/
