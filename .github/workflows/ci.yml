name: CI
on:
  push:
    branches: [main, agent/skillcheck-v0.3]
  pull_request:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/bootstrap-v03.mjs
      - run: npm run check
