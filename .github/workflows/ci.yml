name: SkillCheck v1 release gate

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: skillcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} release verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install workspace from lockfile
        run: npm ci --ignore-scripts
      - name: Run engine, CLI, fixture, and web tests
        run: npm run check
      - name: Verify clean external npm installation
        run: npm run test:package
