name: Apply verified SkillCheck v0.3 release

on:
  push:
    branches: [agent/skillcheck-v0.3]
    paths:
      - "release-v03-final.trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat release-v03-final.part-* | base64 --decode > /tmp/skillcheck-v03-final.tar.gz
          echo "117f5c1d75629fa385986ee7402017a35773560e7959ce8a89f0d2aecc2acd50  /tmp/skillcheck-v03-final.tar.gz" | sha256sum --check -
          git rm -r --ignore-unmatch .
          tar -xzf /tmp/skillcheck-v03-final.tar.gz -C .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release gate
        run: npm run check
      - name: Publish verified source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete SkillCheck v0.3 release"
          git push origin HEAD:agent/skillcheck-v0.3
