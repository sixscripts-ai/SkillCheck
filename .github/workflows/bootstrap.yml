name: Bootstrap SkillCheck MVP

on:
  push:
    branches:
      - agent/skillcheck-mvp
    paths:
      - .skillcheck-bootstrap/**

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skillcheck-mvp
          fetch-depth: 0

      - name: Materialize tested source tree
        shell: bash
        run: |
          cat .skillcheck-bootstrap/archive.part* | base64 --decode > /tmp/skillcheck-src.tar.gz
          tar -xzf /tmp/skillcheck-src.tar.gz
          rm -rf .skillcheck-bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build SkillCheck CI MVP"
          git push origin HEAD:agent/skillcheck-mvp
